services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autoshop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/autoshop?schema=public
      JWT_SECRET: supersecret
    ports: ["4000:4000"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    depends_on: [backend]
